# tzsp-monitor's Grafana settings, used in place of the image's own (entirely
# commented-out) grafana.ini via GF_PATHS_CONFIG. Anything not set here keeps
# Grafana's default.
#
# A file rather than GF_* variables because environment overrides only apply
# to keys that already exist in defaults.ini, and a feature toggle does not --
# GF_FEATURE_TOGGLES_SPLASHSCREEN=false is silently ignored. Read once at
# start: `docker compose restart grafana` after editing.

[dashboards]
# The landing page lists this stack's dashboards in reading order, in place of
# Grafana's welcome/tutorial/blog home. Read from the mount on every load.
default_home_dashboard_path = /opt/tzsp/home.json

# --- Grafana's own clutter ---------------------------------------------------

[news]
news_feed_enabled = false

[help]
enabled = false

[analytics]
reporting_enabled = false
feedback_links_enabled = false
# The image is :latest, so an update is a `docker compose pull`, not a click.
check_for_updates = false
check_for_plugin_updates = false

[feature_toggles]
# The "what's new in Grafana" carousel shown after every login.
splashScreen = false
feedbackButton = false

[dataproxy]
# Adds X-Grafana-User to proxied requests, so pcap-dump's download audit can say
# *who* pulled a capture -- the one action here with a name attached, since the
# Infinity panels all run with the datasource's identity instead.
send_user_header = true
